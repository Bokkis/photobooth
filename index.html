<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yuval Trucking Christmas Party 2026 (Website)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Mountains+of+Christmas:wght@700&family=Poppins:wght@400;600&display=swap">
<style>
:root{--gold:#f2c14e;--gold2:#c9a54a;--cream:#f6e7b4;--muted:#c9d8c2;--red:#c62828;--bg:#0b2418;--frame:#123524}
*{box-sizing:border-box}
body{margin:0;font-family:Poppins,Arial,sans-serif;color:var(--cream);min-height:100vh;background:radial-gradient(circle at 15% 25%,#1f5a3a 0,transparent 38%),radial-gradient(circle at 85% 40%,#184a31 0,transparent 42%),var(--bg)}
nav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 24px;background:rgba(0,0,0,.3);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--gold2)}
nav .brand{font-family:Cinzel,serif;color:var(--gold);letter-spacing:.1em;font-weight:700}
button{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:9px 16px;background:var(--gold);color:#1b1b1b;font-weight:600}
button.ghost{background:transparent;color:var(--cream);border:1px solid var(--gold2)}
.hero{position:relative;display:flex;flex-wrap:wrap;min-height:calc(100vh - 60px);overflow:hidden}
.bg{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.info{position:relative;z-index:1;width:380px;max-width:100%;padding:40px 40px 40px 70px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.info .k{margin:0;font-size:13px;letter-spacing:.2em;color:var(--cream)}
.cinz{font-family:Cinzel,serif}
h1,h2{margin:0;font-family:'Mountains of Christmas',cursive;color:var(--gold);text-shadow:0 3px 0 #7a1212;font-weight:700}
.dept{margin:6px 0 0;font-family:Cinzel,serif;font-size:22px;font-weight:600;letter-spacing:.12em;color:var(--cream);min-height:30px;outline:none}
.plaque{margin-top:12px;padding:8px 28px;border:2px solid var(--gold2);border-radius:8px;background:var(--bg)}
.plaque span{font-family:Cinzel,serif;font-size:26px;font-weight:700;letter-spacing:.25em;color:var(--gold2);text-shadow:0 1px 0 rgba(255,255,255,.35),0 -1px 0 rgba(0,0,0,.8);outline:none}
.editable{outline:none}
body.editing .editable{outline:2px dashed var(--gold);outline-offset:4px;border-radius:4px;cursor:text;background:rgba(242,193,78,.08)}
.hint{font-size:11px;color:var(--muted);letter-spacing:.08em;margin:0}
.photos{position:relative;z-index:1;flex:1;min-width:320px;padding:30px 30px 150px 0;display:flex;flex-direction:column;gap:20px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start;width:100%;max-width:760px;margin:0 auto}
/* Photo frames: white border; frame takes the photo's own shape (portrait works), whole photo visible, no blur, no crop */
.frame{position:relative;width:100%;aspect-ratio:3/4;border:5px solid #fff;border-radius:18px;background:var(--frame);overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:15px}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.frame input{display:none}
.frame .cap{position:absolute;left:0;right:0;bottom:0;padding:18px 10px 6px;background:linear-gradient(transparent,rgba(0,0,0,.7));font-size:12px;color:#fff;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frame.big{grid-column:1/-1;aspect-ratio:16/9}
.frame.filled{font-size:0}
.footer{position:relative;z-index:1;text-align:center;font-size:12px;color:var(--muted);padding:14px;letter-spacing:.08em}
@media(max-width:860px){.info{width:100%;padding:30px 24px}.photos{padding:10px 24px 40px}}
@media(max-width:560px){.pgrid{gap:12px}}
/* ---- Christmas look ---- */
.hero::before{content:"";position:absolute;inset:10px;border:2px solid var(--gold2);border-radius:16px;box-shadow:inset 0 0 0 5px rgba(5,22,16,.6);pointer-events:none;z-index:3}
.snowfall{position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27160%27%20height%3D%27160%27%20viewBox%3D%270%200%20160%20160%27%20fill%3D%27none%27%20stroke%3D%27%23fff%27%20stroke-width%3D%271.4%27%20stroke-linecap%3D%27round%27%20opacity%3D%27.55%27%3E%3Cg%20transform%3D%27translate%2830%2030%29%27%3E%3Cpath%20d%3D%27M0-8V8M-7-4L7%204M-7%204L7-4%27/%3E%3C/g%3E%3Cg%20transform%3D%27translate%28115%2062%29%27%3E%3Cpath%20d%3D%27M0-6V6M-5-3L5%203M-5%203L5-3%27/%3E%3C/g%3E%3Cg%20transform%3D%27translate%2870%20120%29%27%3E%3Cpath%20d%3D%27M0-7V7M-6-3.5L6%203.5M-6%203.5L6-3.5%27/%3E%3C/g%3E%3C/svg%3E");background-size:160px 160px;z-index:0;pointer-events:none}
.ban{background:linear-gradient(#d83a2d,#a21d16);color:#fff!important;padding:6px 26px!important;border-radius:6px;border:2px solid var(--gold);box-shadow:0 3px 0 #6e120d;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.info,.photos{position:relative;z-index:4}
.logo{position:absolute;left:34px;top:22px;width:92px;height:92px;object-fit:contain;background:#fff;border-radius:50%;padding:6px;border:3px solid var(--gold);box-shadow:0 4px 14px rgba(0,0,0,.45);z-index:6}
body.pl .logo{left:26px;top:22px;width:70px;height:70px;padding:4px;border-width:2px}
@page{size:8.5in 5.5in;margin:0}
/* Print / PDF layout: exactly half-sheet bond (8.5in x 5.5in = 816 x 528 px), equal 24px spacing */
body.pl{min-height:0;background:#0b2418}
body.pl nav{display:none!important}
body.pl #sheet{width:816px;height:528px;overflow:hidden}
body.pl .hero{display:grid;grid-template-columns:1fr 387px;gap:24px;padding:24px 24px 24px 24px;height:528px;min-height:0;align-items:center;overflow:hidden}
body.pl .info{width:auto;padding:0;gap:6px;justify-content:center}
body.pl .info .k{font-size:11px!important}
body.pl .info .ban{font-size:20px!important;padding:5px 16px!important}
body.pl .info p.cinz{font-size:17px!important;margin:6px 0 0!important}
body.pl .info .yr{font-size:22px!important}
body.pl .dept{font-size:14px;min-height:0;margin:0}
body.pl .info h1:nth-of-type(1){font-size:56px!important}
body.pl .info h1:nth-of-type(2){font-size:46px!important}
body.pl .info .editable[data-key=partyDate]{font-size:14px!important}
body.pl .plaque{margin-top:6px;padding:5px 20px}
body.pl .plaque span{font-size:19px}
body.pl .hint{font-size:8px}
body.pl .photos{padding:0;min-width:0;width:387px;flex:none;gap:0}
body.pl .pgrid{width:387px;max-width:387px;gap:16px}
body.pl .frame{border-width:4px;border-radius:14px}
body.pl .footer{display:none}
body.pl .hero::before{inset:7px;border-radius:12px}
@media print{html,body{-webkit-print-color-adjust:exact;print-color-adjust:exact;margin:0;width:8.5in;height:5.5in;overflow:hidden;background:#0b2418}}
</style>
</head>

<button class="ghost" id="editBtn">Edit details</button>
<button class="ghost" id="printBtn">Print</button>
<button id="pdfBtn">Download PDF</button>
</div>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
const editBtn = document.getElementById('editBtn');
const modeLabel = document.getElementById('modeLabel');
const editables = [...document.querySelectorAll('.editable')];
let editing = false;

// Restore saved text for this browser (if any)
editables.forEach(el => {
  try {
    const saved = localStorage.getItem('xmas2026-' + el.dataset.key);
    if (saved !== null) el.textContent = saved;
  } catch (e) {}
  if (!el.textContent.trim()) el.textContent = el.dataset.default;
});

function setEditing(on){
  editing = on;
  document.body.classList.toggle('editing', on);
  editables.forEach(el => el.setAttribute('contenteditable', on ? 'true' : 'false'));
  editBtn.textContent = on ? 'Done editing' : 'Edit details';
  modeLabel.textContent = on ? 'Edit mode' : 'View mode';
}
editBtn.addEventListener('click', () => setEditing(!editing));

editables.forEach(el => {
  el.addEventListener('input', () => {
    try { localStorage.setItem('xmas2026-' + el.dataset.key, el.textContent); } catch (e) {}
  });
  el.addEventListener('blur', () => {
    if (!el.textContent.trim()) el.textContent = el.dataset.default;
  });
});

// Photo frames: click to choose an image for that spot
document.querySelectorAll('.frame').forEach(frame => {
  const input = frame.querySelector('input');
  input.addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    frame.querySelectorAll('img,.cap').forEach(n => n.remove());
    const img = document.createElement('img');
    img.alt = file.name;
    img.src = URL.createObjectURL(file);
    img.onload = () => { frame.style.aspectRatio = img.naturalWidth + ' / ' + img.naturalHeight; };
    frame.classList.add('filled');
    frame.insertBefore(img, input);
    const cap = document.createElement('div');
    cap.className = 'cap';
    cap.textContent = file.name.replace(/\.[^.]+$/, '');
    frame.appendChild(cap);
  });
});

window.addEventListener('beforeprint', () => { document.body.classList.add('pl'); fitPrint(); });
function fitPrint(){
  const g = document.querySelector('.pgrid');
  g.style.zoom = '';
  if (!document.body.classList.contains('pl')) return;
  const avail = 528 - 52, hh = g.getBoundingClientRect().height;
  if (hh > avail) g.style.zoom = (avail / hh).toFixed(3);
}

window.addEventListener('afterprint', () => { document.body.classList.remove('pl'); fitPrint(); });
document.getElementById('printBtn').addEventListener('click', () => { if (editing) setEditing(false); window.print(); });
document.getElementById('pdfBtn').addEventListener('click', async () => {
  const btn = document.getElementById('pdfBtn');
  if (editing) setEditing(false);
  if (!window.html2canvas || !window.jspdf) { alert('To save as PDF: in the print window that opens, choose Destination = Save as PDF.'); window.print(); return; }
  btn.disabled = true; btn.textContent = 'Making PDF...';
  try {
    document.body.classList.add('pl'); fitPrint();
    await new Promise(r => setTimeout(r, 300));
    const el = document.getElementById('sheet');
    const c = await html2canvas(el, { scale: 3, useCORS: true, backgroundColor: '#0b2418', width: 816, height: 528, windowWidth: 900 });
    document.body.classList.remove('pl'); fitPrint();
    const pdf = new window.jspdf.jsPDF({ orientation: 'l', unit: 'in', format: [8.5, 5.5] });
    pdf.addImage(c.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, 8.5, 5.5);
    pdf.save('Yuval-Trucking-Christmas-Party-2026.pdf');
  } catch (e) { document.body.classList.remove('pl'); alert('To save as PDF: in the print window that opens, choose Destination = Save as PDF.'); window.print(); }
  btn.disabled = false; btn.textContent = 'Download PDF';
});
</script>
</body>
</html>
