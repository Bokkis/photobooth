<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yuval Trucking Christmas Party 2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Mountains+of+Christmas:wght@700&family=Poppins:wght@400;600&display=swap">
<style>
:root{--gold:#f2c14e;--gold2:#c9a54a;--cream:#f6e7b4;--muted:#c9d8c2;--red:#c62828;--bg:#0b2418;--frame:#123524}
*{box-sizing:border-box}
body{margin:0;font-family:Poppins,Arial,sans-serif;color:var(--cream);min-height:100vh;background:radial-gradient(circle at 15% 25%,#1f5a3a 0,transparent 38%),radial-gradient(circle at 85% 40%,#184a31 0,transparent 42%),var(--bg)}
nav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 24px;background:rgba(0,0,0,.3);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--gold2)}
nav .brand{font-family:Cinzel,serif;color:var(--gold);letter-spacing:.1em;font-weight:700}
button{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:9px 16px;background:var(--gold);color:#1b1b1b;font-weight:600}
button.ghost{background:transparent;color:var(--cream);border:1px solid var(--gold2)}
.hero{position:relative;display:flex;flex-wrap:wrap;justify-content:center;min-height:calc(100vh - 60px);overflow:hidden}
.bg{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.info{position:relative;z-index:1;width:380px;max-width:100%;padding:40px 40px 40px 70px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.cinz{font-family:Cinzel,serif}
h1{margin:0;font-family:'Mountains of Christmas',cursive;color:var(--gold);text-shadow:0 3px 0 #7a1212;font-weight:700}
.dept{margin:6px 0 0;font-family:Cinzel,serif;font-size:22px;font-weight:600;letter-spacing:.12em;color:var(--cream);min-height:30px;outline:none}
.plaque{margin-top:12px;padding:8px 28px;border:2px solid var(--gold2);border-radius:8px;background:var(--bg)}
.plaque span{font-family:Cinzel,serif;font-size:26px;font-weight:700;letter-spacing:.25em;color:var(--gold2);text-shadow:0 1px 0 rgba(255,255,255,.35),0 -1px 0 rgba(0,0,0,.8);outline:none}
.editable{outline:none}
body.editing .editable{outline:2px dashed var(--gold);outline-offset:4px;border-radius:4px;cursor:text;background:rgba(242,193,78,.08)}
.hint{font-size:11px;color:var(--muted);letter-spacing:.08em;margin:0}
.photos{position:relative;z-index:1;padding:30px 30px 150px 0;display:flex;flex-direction:column;align-items:center;gap:20px}
.row{display:flex;gap:20px;justify-content:center}
/* Empty slots keep a fixed size. A filled card takes the exact shape of its photo, so nothing is cut. */
.frame{position:relative;flex:none;box-sizing:border-box;border:5px solid var(--cream);border-radius:18px;background:var(--frame);overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:15px;text-align:center;padding:0}
.frame.top{width:360px;height:240px}
.frame.big{width:740px;height:400px}
.frame input{display:none}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;user-select:none;-webkit-user-drag:none}
.frame .ph{position:relative;z-index:0}
.frame.filled .ph{display:none}
.footer{position:relative;z-index:1;text-align:center;font-size:12px;color:var(--muted);padding:14px;letter-spacing:.08em}
@media(max-width:860px){
  .info{width:100%;padding:30px 24px}
  .photos{padding:10px 16px 40px;width:100%}
  .row{width:100%;flex-wrap:wrap}
  .frame.top:not(.filled){width:calc(50% - 10px);height:auto;aspect-ratio:3/2}
  .frame.big:not(.filled){width:100%;height:auto;aspect-ratio:37/20}
}
/* Print / Save as PDF: one half sheet of short bond paper (8.5 x 5.5 in, landscape) */
@page{size:8.5in 5.5in landscape;margin:0}
@media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body{width:8.5in;height:5.5in;margin:0;overflow:hidden;background:#fff!important}
  /* The green design background belongs to the design area only, so the rest of the paper stays white */
  .hero{background:radial-gradient(circle at 15% 25%,#1f5a3a 0,transparent 38%),radial-gradient(circle at 85% 40%,#184a31 0,transparent 42%),var(--bg)!important}
  .noprint{display:none!important}
  .hero{zoom:.6875;width:1152px!important;height:768px!important;min-height:0!important;flex-wrap:nowrap!important;overflow:hidden;margin:0 auto}
  /* The phone-size breakpoint must not apply on paper (the printed page is narrower than 860px) */
  .info{width:380px!important;max-width:none!important;padding:40px 40px 40px 70px!important}
  .photos{width:770px!important;flex:none!important;padding:30px 30px 150px 0!important;align-items:center!important}
  .row{width:740px!important;flex-wrap:nowrap!important}
  .frame.top:not(.filled){width:360px!important;height:240px!important;aspect-ratio:auto!important}
  .frame.big:not(.filled){width:740px!important;height:400px!important;aspect-ratio:auto!important}
  .editable{outline:none!important;background:none!important}
}
</style>
</head>
<body>

<script>
const editBtn = document.getElementById('editBtn');
const modeLabel = document.getElementById('modeLabel');
const editables = [...document.querySelectorAll('.editable')];
let editing = false;

// Restore saved text for this browser (if any)
editables.forEach(el => {
  try {
    const saved = localStorage.getItem('xmas2026-' + el.dataset.key);
    if (saved !== null) el.textContent = saved;
  } catch (e) {}
  if (!el.textContent.trim()) el.textContent = el.dataset.default;
});

function setEditing(on){
  editing = on;
  document.body.classList.toggle('editing', on);
  editables.forEach(el => el.setAttribute('contenteditable', on ? 'true' : 'false'));
  editBtn.textContent = on ? 'Done editing' : 'Edit details';
  modeLabel.textContent = on ? 'Edit mode' : 'View mode';
}
editBtn.addEventListener('click', () => setEditing(!editing));

editables.forEach(el => {
  el.addEventListener('input', () => {
    try { localStorage.setItem('xmas2026-' + el.dataset.key, el.textContent); } catch (e) {}
  });
  el.addEventListener('blur', () => {
    if (!el.textContent.trim()) el.textContent = el.dataset.default;
  });
});

// The card takes the exact proportion of the photo, so the whole photo shows with no cut and no blur.
// The card stays within its slot (360 x 240 for the small cards, 740 x 400 for the big one).
function fitCard(frame, ratio){
  const big = frame.classList.contains('big');
  const slotW = big ? 740 : 360, slotH = big ? 400 : 240;
  const availW = slotW - 10, availH = slotH - 10; // the 5px border on each side
  let w = availW, h = w / ratio;
  if (h > availH){ h = availH; w = h * ratio; }
  frame.style.width = (w + 10) + 'px';
  frame.style.height = (h + 10) + 'px';
}

document.querySelectorAll('.frame').forEach(frame => {
  const input = frame.querySelector('input');
  input.addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    frame.querySelectorAll('img').forEach(n => n.remove());
    const img = document.createElement('img');
    img.alt = file.name;
    img.draggable = false;
    img.onload = () => fitCard(frame, img.naturalWidth / img.naturalHeight);
    img.src = URL.createObjectURL(file);
    frame.insertBefore(img, input);
    frame.classList.add('filled');
    input.value = '';
  });
});
</script>
